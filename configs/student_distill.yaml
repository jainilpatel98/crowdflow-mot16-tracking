seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 12

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  # cache_root is used only when --use-cache is passed to train_student.py
  cache_root: data/teacher_cache
  # Default: use_cache=false (live teacher; same augmented input for both teacher and student)
  use_cache: false

student:
  backbone_name: resnet50        # default; override with --backbone CLI flag
  pretrained_backbone: true
  fpn_channels: 256
  emb_dim: 128

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 2304]
    p4: [2304, 16384]
    p5: [16384, 1000000000]
  center_radius: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.0001
  lr_heads: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 80              # extended from 60 (Issue 5 — squeeze more from small data)
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill
  temperature: 2.0

phases:
  - start_epoch: 1
    end_epoch: 15         # Phase 1 extended: longer feature alignment warm-up
    weights:
      det: 0.5
      cls_kd: 0.25
      box_kd: 0.25
      feat: 1.0
      emb: 0.25
      id: 0.0
  - start_epoch: 16
    end_epoch: 50
    weights:
      det: 1.0
      cls_kd: 0.5
      box_kd: 0.75
      feat: 0.25
      emb: 0.5
      id: 0.5
  - start_epoch: 51
    end_epoch: 80
    weights:
      det: 1.0
      cls_kd: 0.25
      box_kd: 0.25
      feat: 0.1
      emb: 1.0
      id: 1.0

inference:
  score_threshold: 0.25
  nms_iou_threshold: 0.5
  max_detections: 300
