dataset:
  root: MOT16
  input_size: [640, 640]
  person_class_id: 1
  visibility_threshold: 0.0
  embedding_visibility_threshold: 0.25
  id_visibility_threshold: 0.25
  include_ignore_regions: true
  train_sequences:
    - MOT16-02
    - MOT16-04
    - MOT16-09
    - MOT16-11
    - MOT16-13
  val_sequences:
    - MOT16-05
    - MOT16-10
  test_sequences:
    - MOT16-01
    - MOT16-03
    - MOT16-06
    - MOT16-07
    - MOT16-08
    - MOT16-12
    - MOT16-14
  num_workers: 8
  cache_images: false

augmentation:
  # YOLO-style heavy augmentation (Issue 7)
  letterbox: true

  # Mosaic: combine 4 random frames into 1 (biggest diversity boost for small datasets)
  mosaic_prob: 0.8

  # Copy-paste: paste random person instances from other frames (simulates occlusion)
  copy_paste_prob: 0.3

  # HSV color jitter (YOLO defaults)
  hue: 0.015
  saturation: 0.7
  brightness: 0.4          # maps to HSV-V gain

  # Large-scale jitter (was 0.9-1.1; now matches YOLO's 0.5-2.0)
  affine_scale: [0.5, 2.0]

  # Geometric
  horizontal_flip_prob: 0.5
  affine_degrees: 3.0
  affine_translate: 0.05

  # Motion blur (simulates fast-moving pedestrians)
  motion_blur_prob: 0.15
  blur_kernel: 5

  # Random erase (simulate occlusion boxes)
  erase_prob: 0.2
