seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 12

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  use_cache: false
  cache_root: data/teacher_cache

student:
  backbone_name: se_resnet101
  pretrained_backbone: true
  fpn_channels: 384
  emb_dim: 128
  roi_dropout: 0.4
  tower_layers: 3
  tower_dropout: 0.1      # SE attention + 101 depth warrants stronger regularization
  freeze_backbone_stages: [stem, layer1, layer2]
  freeze_backbone_stages_until_epoch: 20
  backbone_bn_eval: true

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 4096]
    p4: [2304, 20736]
    p5: [14400, 1000000000]
  center_radius:
    p3: 2.5
    p4: 2.0
    p5: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.000008
  lr_heads: 0.0003
  lr_neck: 0.0003
  lr_head: 0.0003
  lr_aux: 0.0004
  weight_decay: 0.0008
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 8
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 55
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_se_resnet101
  temperature: 2.0
  id_label_smoothing: 0.12
  checkpoint_interval: 5

loss_schedule:
  det:
    - [1, 5, 0.8, 1.0]
    - [5, 55, 1.0, 1.0]

  cls_kd:
    - [1, 5, 0.02, 0.02]
    - [5, 22, 0.02, 0.05]
    - [22, 55, 0.05, 0.05]

  box_kd:
    - [1, 15, 0.0, 0.0]
    - [15, 28, 0.0, 0.5]
    - [28, 55, 0.5, 0.5]

  feat:
    - [1, 8, 0.0, 0.0]
    - [8, 22, 0.0, 0.8]
    - [22, 55, 0.8, 0.8]

  emb:
    - [1, 25, 0.0, 0.0]
    - [25, 32, 0.0, 0.15]
    - [32, 55, 0.15, 0.15]

  id:
    - [1, 30, 0.0, 0.0]
    - [30, 42, 0.0, 0.008]
    - [42, 55, 0.008, 0.008]

inference:
  score_threshold: 0.45
  nms_iou_threshold: 0.5
  max_detections: 300
