seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 12

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  use_cache: false
  cache_root: data/teacher_cache

student:
  backbone_name: resnet50
  pretrained_backbone: true
  fpn_channels: 384       # widened 256→384 (#7): p3 now matches teacher p3 channels exactly
  emb_dim: 128
  roi_dropout: 0.3        # (#3) regularise ROI projector to prevent ReID overfitting

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 2304]
    p4: [2304, 16384]
    p5: [16384, 1000000000]
  center_radius: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.0001
  lr_heads: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 80
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_resnet50
  temperature: 2.0
  id_label_smoothing: 0.1      # label smoothing on ID cross-entropy to slow val id_loss divergence
  checkpoint_interval: 5       # save epoch_NNN.pt every 5 epochs for retrospective eval

# Per-loss piecewise-linear weight schedule.
# Each entry is [epoch_start, epoch_end, weight_start, weight_end].
# Weights are linearly interpolated within each segment.
# Activation order follows the dependency chain:
#   det+cls_kd (epoch 1) → box_kd+feat (epoch 7-8) → id (epoch 15) → emb (epoch 22)
# Each loss activates/deactivates separately to prevent simultaneous optimizer shocks.
loss_schedule:
  det:
    - [1,  3,  0.3, 0.3]   # gentle warmup; pretrained backbone needs a few steps
    - [3,  8,  0.3, 1.0]   # ramp up as FPN stabilises
    - [8,  60, 1.0, 1.0]   # hold through mid-training
    - [60, 75, 1.0, 2.0]   # increase focus on detection in final stretch
    - [75, 80, 2.0, 2.0]
  cls_kd:
    - [1,  3,  0.03, 0.03] # low weight; raw cls_kd ~17000 early — keep contribution bounded
    - [3,  15, 0.03, 0.10] # ramp up as raw value falls
    - [15, 50, 0.10, 0.10]
    - [50, 65, 0.10, 0.03] # fade out as detection matures; don't let it fight det in late training
    - [65, 80, 0.03, 0.03]
  box_kd:
    - [1,  7,  0.0,  0.0]  # wait for det positive-cell assignments to stabilise first
    - [7,  12, 0.0,  0.4]  # ramp in after det is stable
    - [12, 65, 0.4,  0.4]
    - [65, 75, 0.4,  0.2]  # fade slightly in final detection emphasis phase
    - [75, 80, 0.2,  0.2]
  feat:
    - [1,  8,  0.0,  0.0]  # wait for FPN to stabilise before adapter tries to align
    - [8,  13, 0.0,  5.0]  # high weight while FPN is still plastic
    - [13, 40, 5.0,  5.0]  # hold high through mid-training
    - [40, 55, 5.0,  1.0]  # decay as FPN converges; adapter's job is mostly done
    - [55, 70, 1.0,  1.0]
    - [70, 80, 1.0,  0.0]  # full fade-out; detection dominates the final epochs
  emb:
    - [1,  22, 0.0,  0.0]  # wait for id_loss to train teacher projector first (7 epochs)
    - [22, 27, 0.0,  0.3]  # ramp in once teacher projector has structure
    - [27, 70, 0.3,  0.3]
    - [70, 80, 0.3,  0.5]  # increase embedding emphasis at end for tracking quality
  id:
    - [1,  15, 0.0,  0.0]  # phase 1: detection only; embeddings not ready for ID supervision
    - [15, 20, 0.0,  0.2]  # ramp in slowly (one new loss at a time — box_kd/feat already active)
    - [20, 55, 0.2,  0.2]
    - [55, 70, 0.2,  0.05] # fade out; shift to emb_kd for embedding signal; reduce overfitting
    - [70, 80, 0.05, 0.05] # residual id weight; model stays slightly discriminative

inference:
  score_threshold: 0.05   # lowered from 0.25; sweep with --sweep-threshold to tune per run
  nms_iou_threshold: 0.5
  max_detections: 300

