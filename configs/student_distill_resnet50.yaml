seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 12

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  # --- Cache control ---
  # Two equivalent ways to enable cache mode:
  #   1. Set use_cache: true here  (applies whenever this config is used)
  #   2. Pass --use-cache on the command line  (overrides this value)
  #
  # DEFAULT = false (live teacher; teacher and student share the same augmented input).
  # Set to true only if GPU memory is tight or teacher inference is too slow.
  # WARNING: cache was computed on canonical (non-augmented) images, so
  #          feature-KD and box-KD signals will have a spatial mismatch with
  #          the augmented student input. Detection + ID losses are unaffected.
  use_cache: false
  cache_root: data/teacher_cache

student:
  backbone_name: resnet50
  pretrained_backbone: true
  fpn_channels: 256
  emb_dim: 128

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 2304]
    p4: [2304, 16384]
    p5: [16384, 1000000000]
  center_radius: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.0001
  lr_heads: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 80
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_resnet50
  temperature: 2.0

phases:
  - start_epoch: 1
    end_epoch: 15
    weights:
      det: 0.5
      cls_kd: 0.25
      box_kd: 0.25
      feat: 1.0
      emb: 0.25
      id: 0.0
  - start_epoch: 16
    end_epoch: 50
    weights:
      det: 1.0
      cls_kd: 0.5
      box_kd: 0.75
      feat: 0.25
      emb: 0.5
      id: 0.5
  - start_epoch: 51
    end_epoch: 80
    weights:
      det: 1.0
      cls_kd: 0.25
      box_kd: 0.25
      feat: 0.1
      emb: 1.0
      id: 1.0

inference:
  score_threshold: 0.25
  nms_iou_threshold: 0.5
  max_detections: 300
