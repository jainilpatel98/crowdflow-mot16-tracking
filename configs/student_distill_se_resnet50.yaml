seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 16          # SE-ResNet50 is comparable weight to ResNet50

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  use_cache: false
  cache_root: data/teacher_cache

student:
  backbone_name: se_resnet50
  pretrained_backbone: true
  fpn_channels: 384
  emb_dim: 128
  roi_dropout: 0.3
  tower_layers: 2
  tower_dropout: 0.05
  freeze_backbone_stages: [stem, layer1]
  freeze_backbone_stages_until_epoch: 15
  backbone_bn_eval: true

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 4096]
    p4: [2304, 20736]
    p5: [14400, 1000000000]
  center_radius:
    p3: 2.5
    p4: 2.0
    p5: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.00005
  lr_heads: 0.0004
  lr_neck: 0.0004
  lr_head: 0.0004
  lr_aux: 0.0005
  weight_decay: 0.0005
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 5
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 60
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_se_resnet50
  temperature: 2.0
  id_label_smoothing: 0.1
  checkpoint_interval: 5

loss_schedule:
  det:
    - [1, 5, 0.8, 1.0]
    - [5, 60, 1.0, 1.0]

  cls_kd:
    - [1, 5, 0.02, 0.02]
    - [5, 20, 0.02, 0.05]
    - [20, 60, 0.05, 0.05]

  box_kd:
    - [1, 12, 0.0, 0.0]
    - [12, 25, 0.0, 0.4]
    - [25, 60, 0.4, 0.4]

  feat:
    - [1, 8, 0.0, 0.0]
    - [8, 20, 0.0, 0.8]
    - [20, 60, 0.8, 0.8]

  emb:
    - [1, 22, 0.0, 0.0]
    - [22, 30, 0.0, 0.15]
    - [30, 60, 0.15, 0.15]

  id:
    - [1, 25, 0.0, 0.0]
    - [25, 38, 0.0, 0.01]
    - [38, 60, 0.01, 0.01]

inference:
  score_threshold: 0.40
  nms_iou_threshold: 0.5
  max_detections: 300
