seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 24          # MobileNetV3 is very lightweight — large batch

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  cache_root: data/teacher_cache
  use_cache: false        # live inference avoids cache invalidation

student:
  backbone_name: mobilenetv3_large
  pretrained_backbone: true
  fpn_channels: 192       # lighter channels for mobile model
  emb_dim: 128
  roi_dropout: 0.3
  tower_layers: 2
  tower_dropout: 0.0      # MobileNetV3 already uses depthwise conv — no extra dropout
  # MobileNetV3 has fewer params; only freeze stem
  freeze_backbone_stages: [stem]
  freeze_backbone_stages_until_epoch: 8
  backbone_bn_eval: true

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 4096]
    p4: [2304, 20736]
    p5: [14400, 1000000000]
  center_radius:
    p3: 2.5
    p4: 2.0
    p5: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.0001     # higher LR for lightweight backbone (smaller capacity)
  lr_heads: 0.0006
  lr_neck: 0.0006
  lr_head: 0.0006
  lr_aux: 0.0008
  weight_decay: 0.0003    # moderate regularization
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 60
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_mobilenetv3_large
  temperature: 2.0
  id_label_smoothing: 0.1
  checkpoint_interval: 5

loss_schedule:
  det:
    - [1, 5, 0.8, 1.0]
    - [5, 60, 1.0, 1.0]

  cls_kd:
    - [1, 5, 0.02, 0.02]
    - [5, 15, 0.02, 0.05]
    - [15, 60, 0.05, 0.05]

  # box_kd early for MobileNet — lighter models converge faster
  box_kd:
    - [1, 8, 0.0, 0.0]
    - [8, 18, 0.0, 0.4]
    - [18, 60, 0.4, 0.4]

  feat:
    - [1, 5, 0.0, 0.0]
    - [5, 15, 0.0, 0.8]
    - [15, 60, 0.8, 0.8]

  emb:
    - [1, 18, 0.0, 0.0]
    - [18, 25, 0.0, 0.15]
    - [25, 60, 0.15, 0.15]

  id:
    - [1, 20, 0.0, 0.0]
    - [20, 30, 0.0, 0.01]
    - [30, 60, 0.01, 0.01]

inference:
  # MobileNetV3 lower capacity → scores less calibrated; start at 0.35
  score_threshold: 0.35
  nms_iou_threshold: 0.5
  max_detections: 300
