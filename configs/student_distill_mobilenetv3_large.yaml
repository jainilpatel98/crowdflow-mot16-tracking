seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 14

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  cache_root: data/teacher_cache
  use_cache: true

student:
  backbone_name: mobilenetv3_large
  pretrained_backbone: true
  fpn_channels: 192
  emb_dim: 128
  roi_dropout: 0.3

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 2304]
    p4: [2304, 16384]
    p5: [16384, 1000000000]
  center_radius: 1.5

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.0002
  lr_heads: 0.0008
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 60
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_mobilenetv3_large
  temperature: 2.0

phases:
  - start_epoch: 1
    end_epoch: 10
    weights:
      det: 0.5
      cls_kd: 0.25
      box_kd: 0.25
      feat: 5.0
      emb: 0.25
      id: 0.0
  - start_epoch: 11
    end_epoch: 40
    weights:
      det: 1.0
      cls_kd: 0.5
      box_kd: 0.75
      feat: 2.0
      emb: 0.5
      id: 0.5
  - start_epoch: 41
    end_epoch: 60
    weights:
      det: 2.0
      cls_kd: 0.5
      box_kd: 0.5
      feat: 0.5
      emb: 0.3
      id: 0.5

inference:
  score_threshold: 0.05
  nms_iou_threshold: 0.5
  max_detections: 300
