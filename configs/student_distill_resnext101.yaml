seed: 1337

dataset:
  config: configs/dataset_mot16.yaml
  batch_size: 12

teacher:
  ckpt_path: code/yolo26x.pt
  device: cuda
  person_class: 0
  freeze: true
  feature_channels:
    p3: 384
    p4: 768
    p5: 768
  use_cache: false
  cache_root: data/teacher_cache

student:
  backbone_name: resnext101_32x8d
  pretrained_backbone: true
  fpn_channels: 384
  emb_dim: 128
  roi_dropout: 0.5
  tower_layers: 3
  tower_dropout: 0.1      # head regularization — validated effective in train9
  freeze_backbone_stages: [stem, layer1, layer2]
  freeze_backbone_stages_until_epoch: 25   # validated: kept det_gap from widening
  backbone_bn_eval: true

assigner:
  strides:
    p3: 8
    p4: 16
    p5: 32
  area_ranges:
    p3: [0, 4096]           # up to 64px² — catches small pedestrians
    p4: [2304, 20736]       # 48-144px overlap range
    p5: [14400, 1000000000] # 120px+
  # Per-level center_radius.
  center_radius:
    p3: 2.5    # 5×5 cells × stride=8 = 40px center zone
    p4: 2.0    # 5×5 cells × stride=16 = 80px zone
    p5: 1.5    # 4×4 cells × stride=32 = 96px zone
  # P1 (train10): Relax point-in-box for small GT boxes.
  # GT boxes below 32×32=1024px² skip the inside-box check → use center-only
  # assignment.  This is the root fix for the recall ceiling: per-level radius
  # expansions are inert when the inside constraint discards all the new cells.
  small_obj_area_threshold: 1024  # 32×32 px²

sampler:
  balance_sequences: true
  replacement: true

optimizer:
  name: adamw
  lr_backbone: 0.000005   # validated low LR keeps backbone drift controlled
  lr_heads: 0.0002
  lr_neck: 0.0002
  lr_head: 0.0002
  lr_aux: 0.0003
  weight_decay: 0.001     # validated: narrowed det_gap from 1.84→1.15
  betas: [0.9, 0.999]

scheduler:
  warmup_epochs: 10
  min_lr_ratio: 0.05

training:
  device: cuda
  epochs: 65              # P3: extended from 50; train9 best=ep41, still ~0.013 F1 below peak
                          # at ep50 — adding 15 more epochs to confirm and capture the tail.
  amp: true
  grad_clip: 1.0
  log_interval: 20
  output_dir: runs/student_distill_resnext101
  temperature: 2.0
  id_label_smoothing: 0.15
  checkpoint_interval: 5

loss_schedule:
  det:
    - [1, 5, 0.8, 1.0]
    - [5, 65, 1.0, 1.0]   # Hold — never decay

  cls_kd:
    - [1, 5, 0.02, 0.02]
    - [5, 25, 0.02, 0.05]  # Ramp alongside backbone unfreeze (ep25)
    - [25, 65, 0.05, 0.05] # Hold flat

  # P4: box_kd now uses GT-anchored CIoU (0.75·CIoU(pred,GT) + 0.25·CIoU(pred,teacher)).
  # Onset at ep15 is preserved from train9 — box_kd must see the best-checkpoint window.
  box_kd:
    - [1, 15, 0.0, 0.0]      # Let det stabilize first
    - [15, 30, 0.0, 0.5]     # Ramp in alongside backbone unfreeze
    - [30, 65, 0.5, 0.5]     # Hold flat

  feat:
    - [1, 8, 0.0, 0.0]
    - [8, 20, 0.0, 0.8]
    - [20, 65, 0.8, 0.8]     # Hold flat

  emb:
    - [1, 28, 0.0, 0.0]
    - [28, 35, 0.0, 0.15]
    - [35, 65, 0.15, 0.15]   # Hold flat

  id:
    - [1, 35, 0.0, 0.0]
    - [35, 50, 0.0, 0.008]   # Slow ramp
    - [50, 65, 0.008, 0.008] # Hold flat

inference:
  # score_threshold=0.50 is the sweep-optimal F1 operating point (train9 best.pt sweep):
  #   Thresh  mAP@.5   Precision  Recall    F1       Preds
  #   0.500   0.5036   0.8718     0.4526    0.5959   9,935
  #   0.450   0.5036   0.7886     0.4697    0.5887  11,398
  #   0.400   0.5036   0.6849     0.4879    0.5699  13,633
  # For MOT tracking (recall > precision), consider score_threshold=0.40.
  score_threshold: 0.50
  nms_iou_threshold: 0.5
  max_detections: 300
